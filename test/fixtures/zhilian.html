<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>智联校园招聘申请表</title></head>
<body>
<form id="form">
  <div class="form-item"><label>姓名 <i class="star">*</i><input type="text" name="name"></label></div>
  <div class="form-item"><label>手机号<input type="tel" name="phone"></label></div>
  <div class="form-item"><label>邮箱<input type="email" name="email"></label></div>
  <div class="form-item"><label>性别</label><input type="radio" name="gender" value="男">男<input type="radio" name="gender" value="女">女</div>
  <div class="form-item"><label>学历<select name="degree"><option value="">请选择</option><option value="本科">本科</option><option value="硕士">硕士</option></select></label></div>
  <div class="form-item"><label>专业<input type="text" name="major"></label></div>
  <div class="form-item"><label>毕业院校<input type="text" name="school"></label></div>
  <div class="form-item"><label>期望城市<input type="text" name="expectedCity"></label></div>
  <div class="form-item"><label>期望职位<input type="text" name="expectedPosition"></label></div>
  <div class="form-item"><label>到岗时间<select name="arrival"><option value="">请选择</option><option value="随时到岗">随时到岗</option><option value="一个月内">一个月内</option></select></label></div>
  <div class="form-item"><label>自我评价<textarea name="intro"></textarea></label></div>
</form>
</body>
</html>
