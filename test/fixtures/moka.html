<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Moka 校招申请表</title></head>
<body>
<form id="form">
  <div class="form-group"><label for="m-name">姓名</label><input id="m-name" name="name" type="text"></div>
  <div class="form-group"><label for="m-phone">联系电话</label><input id="m-phone" name="phone" type="tel"></div>
  <div class="form-group"><label for="m-email">邮箱</label><input id="m-email" name="email" type="email"></div>
  <div class="form-group"><label for="m-city">现居城市</label><input id="m-city" name="city" type="text"></div>
  <div class="form-group"><label for="m-school">毕业院校</label><input id="m-school" name="school" type="text"></div>
  <div class="form-group"><label for="m-degree">学历</label><select id="m-degree" name="degree"><option value="">请选择</option><option value="大专">大专</option><option value="本科">本科</option><option value="硕士">硕士</option></select></div>
  <div class="form-group"><label for="m-major">专业</label><input id="m-major" name="major" type="text"></div>
  <div class="form-group"><label for="m-years">工作年限</label><select id="m-years" name="years"><option value="">请选择</option><option value="1-3年">1-3年</option><option value="3-5年">3-5年</option><option value="5-10年">5-10年</option></select></div>
  <div class="form-group"><label for="m-intro">自我介绍</label><textarea id="m-intro" name="intro"></textarea></div>
  <div class="form-group"><label for="m-date">出生日期</label><input id="m-date" name="birth" type="date"></div>
</form>
</body>
</html>
