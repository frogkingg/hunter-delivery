<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>北森招聘申请表</title></head>
<body>
<form id="form">
  <div class="field"><span class="control-label">姓名</span><input name="name" type="text"></div>
  <div class="field"><span class="control-label">手机号</span><input name="phone" type="tel"></div>
  <div class="field"><span class="control-label">邮箱</span><input name="email" type="email"></div>
  <div class="field"><span class="control-label">性别</span><label><input type="radio" name="gender" value="男">男</label><label><input type="radio" name="gender" value="女">女</label></div>
  <div class="field"><span class="control-label">生日</span><input type="date" name="birth"></div>
  <div class="field"><span class="control-label">籍贯</span><input name="hometown" type="text"></div>
  <div class="field"><span class="control-label">政治面貌</span><select name="politics"><option value="">请选择</option><option value="中共党员">中共党员</option><option value="群众">群众</option></select></div>
  <div class="field"><span class="control-label">婚姻状况</span><select name="marriage"><option value="">请选择</option><option value="1">未婚</option><option value="2">已婚</option></select></div>
  <div class="field"><span class="control-label">通讯地址</span><input name="address" type="text"></div>
  <div class="field"><span class="control-label">邮编</span><input name="postcode" type="text"></div>
  <div class="field"><span class="control-label">实习公司</span><input name="internCompany" type="text"></div>
  <div class="field"><span class="control-label">实习岗位</span><input name="internTitle" type="text"></div>
  <div class="field"><span class="control-label">实习时间</span><input name="internPeriod" type="text"></div>
  <div class="field"><span class="control-label">实习内容</span><textarea name="internDesc"></textarea></div>
  <div class="field"><span class="control-label">项目名称</span><input name="projectName" type="text"></div>
  <div class="field"><span class="control-label">项目角色</span><input name="projectRole" type="text"></div>
  <div class="field"><span class="control-label">项目内容</span><textarea name="projectDesc"></textarea></div>
</form>
</body>
</html>
