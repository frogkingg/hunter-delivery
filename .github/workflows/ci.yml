name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 语法门禁（含 playbook 校验）
        run: npm run check
      - name: 单元与集成测试
        run: npm test
      - name: 生产构建
        run: npm run build